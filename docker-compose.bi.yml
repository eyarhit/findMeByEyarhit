# MySQL XAMPP + Talend ETL + Power BI Desktop (hôte Windows)
# Usage : docker compose -f docker-compose.bi.yml run --rm talend-etl
services:
  talend-etl:
    build:
      context: ./bi/talend/docker
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3306
      MYSQL_ETL_USER: root
      MYSQL_ETL_PASSWORD: root
      DW_SCHEMA_SQL: /ddl/schema.sql
    volumes:
      - ./bi/dw/schema.sql:/ddl/schema.sql:ro
      - ./bi/dw/migrations/001_patch_etl_log_scd2.sql:/ddl/migrations/001_patch_etl_log_scd2.sql:ro
