apiVersion: apps/v1
kind: Deployment
metadata:
  name: codingame
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codingame
  template:
    metadata:
      labels:
        app: codingame
    spec:
      containers:
        - name: codingame
          image: depot.dpc.com.tn:8443/find-me-pfe/coding-game:v-0.0.40
          ports:
             - containerPort: 9056
---


apiVersion: v1
kind: Service
metadata:
  name: codingame
spec:
  selector:
    app: codingame
  ports:
    - protocol: TCP
      port: 80          # Exposing service on port 80
      targetPort: 9056  # Targeting container port 8761
  type: LoadBalancer
---


apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codingame-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
  - host: codingame.dpc.com.tn
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: codingame
              port:
                number: 80  # Matching the service port
  tls:
    - hosts:
        - codingame.dpc.com.tn
      secretName: codingame-tls-secret


