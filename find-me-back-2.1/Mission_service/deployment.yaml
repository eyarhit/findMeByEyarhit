apiVersion: apps/v1
kind: Deployment
metadata:
  name: mission
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mission  # Updated to match the label in the template
  template:
    metadata:
      labels:
        app: mission  # This should match the selector
    spec:
      containers:
        - name: mission
          image: depot.dpc.com.tn:8443/find-me-pfe/mission:v-0.0.40
          ports:
             - containerPort: 9055
---
apiVersion: v1
kind: Service
metadata:
  name: mission
spec:
  selector:
    app: mission
  ports:
    - protocol: TCP
      port: 80          
      targetPort: 9055  
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mission-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
  - host: find-me.2.1-mission.dpc.com.tn
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: mission
              port:
                number: 80  
  tls:
    - hosts:
        - find-me.2.1-mission.dpc.com.tn
      secretName: mission-tls-secret

