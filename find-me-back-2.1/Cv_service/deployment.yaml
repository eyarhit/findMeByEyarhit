apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cv
  template:
    metadata:
      labels:
        app: cv
    spec:
      containers:
        - name: cv
          image: depot.dpc.com.tn:8443/find-me-pfe/cv:v-0.0.40
          ports:
            - containerPort: 9158


---

apiVersion: v1
kind: Service
metadata:
  name: cv
spec:
  selector:
    app: cv
  ports:
    - protocol: TCP
      port: 80          # Exposing service on port 80
      targetPort: 9158  # Targeting container port 8761
  type: LoadBalancer
---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cv-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
  - host: find-me.2.1-cv.dpc.com.tn
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: cv
              port:
                number: 80  # Matching the service port
  tls:
    - hosts:
        - find-me.2.1-cv.dpc.com.tn
      secretName: cv-tls-secret

