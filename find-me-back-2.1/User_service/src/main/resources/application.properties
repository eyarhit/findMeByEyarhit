spring.application.name=user-service
server.port=9068

spring.cloud.discovery.enabled=true
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka



# MySQL local (crée la base si elle n'existe pas ; utilisateur root sans mot de passe = XAMPP par défaut)
spring.datasource.url=jdbc:mysql://localhost:3306/user_bd?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# JPA et Hibernate
spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Permet les r?f?rences circulaires
spring.main.allow-circular-references=true

# Email (OTP inscription, confirmation compte, mot de passe oublié)
# Identifiants : variables SPRING_MAIL_* (fichier .env à la racine du projet, non versionné)
mail.default-encoding=UTF-8
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
messages.basename=base


## Maximum allowed size for uploaded files.
#spring.servlet.multipart.max-file-size=100MB
## Maximum allowed size for multipart/form-data requests.
#spring.servlet.multipart.max-request-size=100MB
#file.upload-dir=uploads

# File Storage
file.upload-dir=./uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# BLOB / LOB (MySQL)
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html


application.file.uploads.photos-output-path= ./uploads



