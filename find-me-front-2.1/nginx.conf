server {
    listen 80;
    server_name [::];

    # Allow larger file uploads
    client_max_body_size 500M;

    # Hub BI (même origine que l'app — évite CORS et ports bloqués)
    location /bi-api/ {
        proxy_pass http://bi-hub:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
    }

    location / {
        root /usr/share/nginx/html/;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Always fetch fresh index.html (has hashed CSS/JS names after each rebuild)
    location = /index.html {
        root /usr/share/nginx/html/;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ~* \.(?:css|js|mjs|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        root /usr/share/nginx/html/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}