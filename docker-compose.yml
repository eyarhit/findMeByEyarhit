services:
  mysql:
    image: mysql:8.4
    container_name: findme-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_bd
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -proot --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: findme-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    container_name: findme-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    # Script sur une seule chaîne : évite les ambiguïtés YAML `>` / guillemets qui peuvent
    # laisser le conteneur « tourner » sans exit (user-service attend alors completed_successfully).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
        mc mb -p local/find-me || true;
        mc anonymous set private local/find-me || true;
        echo "minio-init: ok";
        exit 0

  discovery-service:
    build:
      context: .
      dockerfile: find-me-back-2.1/DiscoveryService/Dockerfile
    container_name: findme-discovery
    restart: unless-stopped
    ports:
      - "8761:8761"
    depends_on:
      mysql:
        condition: service_healthy

  gateway-service:
    build:
      context: .
      dockerfile: find-me-back-2.1/GatewayService/Dockerfile
    container_name: findme-gateway
    restart: unless-stopped
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
    ports:
      - "9082:9082"
    depends_on:
      - discovery-service

  user-service:
    build:
      context: .
      dockerfile: find-me-back-2.1/User_service/Dockerfile
    container_name: findme-user
    restart: unless-stopped
    env_file:
      - .env
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_bd?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: find-me
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: "587"
    ports:
      - "9068:9068"
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  cv-service:
    build:
      context: .
      dockerfile: find-me-back-2.1/Cv_service/Dockerfile
    container_name: findme-cv
    restart: unless-stopped
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cv_bd?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "9158:9158"
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_started

  mission-service:
    build:
      context: .
      dockerfile: find-me-back-2.1/Mission_service/Dockerfile
    container_name: findme-mission
    restart: unless-stopped
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mission_bd?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SERVER_PORT: 9055
    ports:
      - "9055:9055"
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_started

  quiz-service:
    build:
      context: .
      dockerfile: find-me-back-2.1/QuizService/Dockerfile
    container_name: findme-quiz
    restart: unless-stopped
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/quiz_bd?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "9074:9074"
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_started

  codingame-service:
    build:
      context: .
      dockerfile: find-me-back-2.1/CodingameService/Dockerfile
    container_name: findme-codingame
    restart: unless-stopped
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/codingame_bd?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "9056:9056"
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_started

  python-service:
    build:
      context: ./find-me-python-2.1
    container_name: findme-python
    restart: unless-stopped
    ports:
      - "8000:8000"

  # BI PFE (formation BIS) : Talend ETL → findme_dw → Power BI Desktop (OLAP)
  talend-etl:
    profiles: ["bi"]
    build:
      context: ./bi/talend/docker
    restart: "no"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_ETL_USER: root
      MYSQL_ETL_PASSWORD: root
      DW_SCHEMA_SQL: /ddl/schema.sql
      DW_PATCH_SQL: /ddl/migrations/001_patch_etl_log_scd2.sql
    volumes:
      - ./bi/dw/schema.sql:/ddl/schema.sql:ro
      - ./bi/dw/migrations/001_patch_etl_log_scd2.sql:/ddl/migrations/001_patch_etl_log_scd2.sql:ro
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./find-me-front-2.1
    container_name: findme-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      gateway-service:
        condition: service_started
      user-service:
        condition: service_started
      cv-service:
        condition: service_started
      mission-service:
        condition: service_started
      quiz-service:
        condition: service_started
      codingame-service:
        condition: service_started
      python-service:
        condition: service_started

volumes:
  mysql_data:
  minio_data:
